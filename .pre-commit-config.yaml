repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
      - id: ruff-format
        args: [--check]

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.69
    hooks:
      - id: ty

  - repo: https://github.com/facebook/pyrefly-pre-commit
    rev: "1.2.0"
    hooks:
      - id: pyrefly-check
        additional_dependencies:
          ["httpx>=0.28.1", "pillow>=11.4.0", "pymupdf>=1.28.2", "pytest>=9.1.1"]

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
